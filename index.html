<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf3;
      --accent: #3dd6c6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #1a3a3a 0%, transparent 55%),
        var(--bg);
      color: var(--fg);
    }
    main { text-align: center; padding: 2rem; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--fg), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin-top: 1rem;
      opacity: 0.65;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>部署在 GitHub Pages 上</p>
  </main>
</body>
</html>
